<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JP Vocab Review</title>
<style>
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d7dae0;
    --text: #14171f;
    --text-muted: #6b7280;
    --text-faint: #9aa0ab;
    --accent: #2f5fe0;
    --accent-hover: #2650c2;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --radius-lg: 14px;
    --radius-md: 8px;
    --radius-sm: 6px;
    --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 1px 12px rgba(16,24,40,.05);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font);
    max-width: 920px;
    margin: 0 auto;
    padding: 0 20px 48px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(244,245,248,.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 16px 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
  }
  header h1 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
  #summary { font-size: 12.5px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
  header label { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  header input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }

  button {
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    transition: background .12s ease, border-color .12s ease, transform .04s ease;
  }
  button:hover { background: #fafbfc; border-color: #c6cad3; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.danger { background: var(--danger); color: white; border-color: var(--danger); }
  button.danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); }
  button:disabled { opacity: .5; cursor: default; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-card);
  }
  .row { display: flex; gap: 22px; }
  .fields { flex: 1; min-width: 0; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 14px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    background: #fcfcfd;
    transition: border-color .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(47,95,224,.12);
  }
  .preview { font-size: 21px; margin: 2px 0 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .preview .jpn { margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
  ruby rt { font-size: 11px; color: var(--text-muted); }
  .imgbox { width: 160px; flex-shrink: 0; text-align: center; }
  .imgbox img { max-width: 100%; max-height: 140px; border-radius: var(--radius-md); border: 1px solid var(--border); display: block; margin: 0 auto; }
  .imgbox .noimg {
    width: 100%; height: 100px;
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-faint); font-size: 12px;
    background: #fafbfc;
  }
  .status {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 3px 9px;
    border-radius: 100px;
  }
  .status.pending { background: #fef3c7; color: #92400e; }
  .status.needs_edit { background: #fee2e2; color: #991b1b; }
  .status.approved { background: #d1fae5; color: #065f46; }
  .status.pushed { background: #dbeafe; color: #1e40af; }
  .actions { margin-top: 12px; display: flex; gap: 8px; }
  .candidates { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .candidates img {
    width: 90px; height: 90px; object-fit: cover;
    border-radius: var(--radius-sm); cursor: pointer;
    border: 2px solid var(--border);
    transition: border-color .12s ease, transform .12s ease;
  }
  .candidates img:hover { border-color: var(--accent); transform: translateY(-1px); }
  .imgpanel {
    margin-top: 12px; padding: 12px;
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    display: none;
  }
  .imgpanel.open { display: block; }
  .imgpanel .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .imgpanel input[type=text] { width: 200px; font-size: 13px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; }
  .imgbtns { display: flex; gap: 6px; margin-top: 8px; }
  .audiobox { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; }
  .audio-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .audio-row label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); width: 62px; flex-shrink: 0; }
  .audio-row audio { height: 32px; max-width: 220px; }
  .audio-row .noaudio { font-size: 12.5px; color: var(--text-faint); font-style: italic; }
  .audio-row .attribution { font-size: 11px; color: var(--text-faint); }
  #voiceBar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
  #voiceBar select { font-size: 13px; padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); font-family: inherit; }
  #genAllBar { display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
  #genAllBar progress { width: 120px; accent-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>JP Vocab Review</h1>
  <label style="font-size:13px;"><input type="checkbox" id="hideDone" checked> hide approved/pushed</label>
  <div id="voiceBar">
    <label for="voiceSelect">Voice:</label>
    <select id="voiceSelect"><option value="">loading…</option></select>
  </div>
  <button id="genAllBtn">Generate all audio</button>
  <div id="genAllBar"><progress id="genAllProgress" value="0" max="1"></progress><span id="genAllStatus"></span></div>
  <span id="summary"></span>
  <button class="primary" id="pushBtn">Push approved to Anki</button>
</header>
<div id="cards"></div>

<script>
let state = { cards: [] };
let voices = [];

async function loadVoices() {
  const sel = document.getElementById('voiceSelect');
  try {
    const res = await fetch('/api/voices');
    const data = await res.json();
    if (data.error) { sel.innerHTML = `<option value="">${escapeHtml(data.error)}</option>`; return; }
    voices = data.voices || [];
    sel.innerHTML = voices.map(v => `<option value="${v.voice_id}">${escapeHtml(v.name)}</option>`).join('');
    const dflt = voices.find(v => v.name.toLowerCase().startsWith('will'));
    if (dflt) sel.value = dflt.voice_id;
  } catch (e) {
    sel.innerHTML = `<option value="">error loading voices</option>`;
  }
}

function selectedVoice() {
  const sel = document.getElementById('voiceSelect');
  const v = voices.find(v => v.voice_id === sel.value);
  return v ? { voice_id: v.voice_id, voice_name: v.name } : null;
}

function toRuby(text) {
  if (!text) return '';
  return text.replace(/([^\s\[\]]+)\[([^\]]+)\]/g, '<ruby>$1<rt>$2</rt></ruby>');
}
function stripFurigana(text) {
  return (text || '').replace(/\[[^\]]*\]/g, '');
}

async function loadCards() {
  const res = await fetch('/api/cards');
  state = await res.json();
  render();
}

function render() {
  const hideDone = document.getElementById('hideDone').checked;
  const container = document.getElementById('cards');
  container.innerHTML = '';
  const counts = { pending: 0, needs_edit: 0, approved: 0, pushed: 0 };
  for (const c of state.cards) counts[c.status] = (counts[c.status] || 0) + 1;
  document.getElementById('summary').textContent =
    `pending ${counts.pending||0} · needs edit ${counts.needs_edit||0} · approved ${counts.approved||0} · pushed ${counts.pushed||0}`;

  for (const card of state.cards) {
    if (hideDone && (card.status === 'approved' || card.status === 'pushed')) continue;
    container.appendChild(renderCard(card));
  }
}

function renderWordAudioRow(card) {
  return renderAudioRow(card, 'word', 'Word');
}

function renderSentenceAudioRow(card) {
  return renderAudioRow(card, 'sentence', 'Sentence');
}

function renderAudioRow(card, kind, label) {
  const path = card[`audio_${kind}_path`];
  const url = path ? `/audio/${path.split('/').pop()}` : null;
  const attribution = card[`audio_${kind}_source`] === 'elevenlabs' ? `ElevenLabs — ${card[`audio_${kind}_attribution`] || ''}` : '';
  return `
    <div class="audio-row" data-kind="${kind}">
      <label>${label}</label>
      ${url ? `<audio controls src="${url}?t=${Date.now()}"></audio>` : `<span class="noaudio">no audio</span>`}
      ${attribution ? `<span class="attribution">${escapeHtml(attribution)}</span>` : ''}
      <button data-act="gen_audio" data-kind="${kind}">${url ? 'Regenerate' : 'Generate'}</button>
      ${url ? `<button data-act="remove_audio" data-kind="${kind}" class="danger">Remove</button>` : ''}
    </div>
  `;
}

function bindAudioRow(rowEl, card) {
  const genBtn = rowEl.querySelector('[data-act=gen_audio]');
  if (genBtn) genBtn.addEventListener('click', () => generateAudio(card, genBtn.dataset.kind));
  const rmBtn = rowEl.querySelector('[data-act=remove_audio]');
  if (rmBtn) rmBtn.addEventListener('click', () => removeAudio(card, rmBtn.dataset.kind));
}

function refreshAudioRow(card, kind) {
  const cardEl = document.querySelector(`.card[data-id="${card.id}"]`);
  if (!cardEl) return; // card not currently rendered (e.g. hidden by the approved/pushed filter)
  const rowEl = cardEl.querySelector(`.audio-row[data-kind="${kind}"]`);
  if (!rowEl) return;
  const wrapper = document.createElement('div');
  wrapper.innerHTML = (kind === 'word' ? renderWordAudioRow(card) : renderSentenceAudioRow(card)).trim();
  const newRow = wrapper.firstElementChild;
  rowEl.replaceWith(newRow);
  bindAudioRow(newRow, card);
}

function renderCard(card) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.id = card.id;
  const imgUrl = card.image_path ? `/images/${card.image_path.split('/').pop()}` : null;

  el.innerHTML = `
    <div class="row">
      <div class="fields">
        <div class="preview">
          <div class="jpn">${toRuby(card.expression)} <span class="status ${card.status}">${card.status}</span></div>
          <div style="font-size:14px;color:#555">${card.meaning || ''}</div>
        </div>
        <div class="field"><label>Expression</label><input data-f="expression" value="${escapeAttr(card.expression)}"></div>
        <div class="field"><label>Meaning</label><input data-f="meaning" value="${escapeAttr(card.meaning)}"></div>
        <div class="field"><label>Example (Japanese)</label><input data-f="example_jpn" value="${escapeAttr(card.example_jpn)}"></div>
        <div class="preview" style="font-size:15px">${toRuby(card.example_jpn)}</div>
        <div class="field"><label>Example (English)</label><input data-f="example_en" value="${escapeAttr(card.example_en)}"></div>
        <div class="field"><label>Notes for AI (what to change)</label><textarea data-f="notes" rows="2">${escapeHtml(card.notes || '')}</textarea></div>
        <div class="actions">
          <button data-act="save">Save edits</button>
          <button data-act="approve" class="primary">Approve</button>
          <button data-act="needs_edit" class="danger">Mark needs edit</button>
        </div>
        <div class="audiobox">
          ${renderWordAudioRow(card)}
          ${renderSentenceAudioRow(card)}
        </div>
      </div>
      <div class="imgbox">
        ${imgUrl ? `<img src="${imgUrl}">` : `<div class="noimg">no image</div>`}
        <div style="font-size:11px;color:#888;margin-top:4px">${card.image_source || ''}</div>
        <div class="imgbtns">
          <button data-act="change_image" style="flex:1">Change image</button>
          ${imgUrl ? `<button data-act="remove_image" class="danger" style="flex:1">Remove</button>` : ''}
        </div>
        <div class="imgpanel">
          <div class="tabs">
            <button data-src="irasutoya">Irasutoya</button>
            <button data-src="pixabay">Pixabay</button>
          </div>
          <input type="text" class="searchq" value="${escapeAttr(stripFurigana(card.expression))}">
          <button data-act="search_img">Search</button>
          <div class="candidates"></div>
        </div>
      </div>
    </div>
  `;

  el.querySelectorAll('[data-f]').forEach(input => {
    input.addEventListener('input', () => { card[input.dataset.f] = input.value; });
  });
  el.querySelector('[data-act=save]').addEventListener('click', () => updateCard(card));
  el.querySelector('[data-act=approve]').addEventListener('click', () => { card.status = 'approved'; updateCard(card, true); });
  el.querySelector('[data-act=needs_edit]').addEventListener('click', () => { card.status = 'needs_edit'; updateCard(card, true); });

  const removeImgBtn = el.querySelector('[data-act=remove_image]');
  if (removeImgBtn) removeImgBtn.addEventListener('click', () => removeImage(card));

  el.querySelectorAll('.audio-row').forEach(rowEl => bindAudioRow(rowEl, card));

  const panel = el.querySelector('.imgpanel');
  let activeSource = 'irasutoya';
  const searchqInput = el.querySelector('.searchq');
  el.querySelectorAll('[data-src]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSource = btn.dataset.src;
      // Pixabay's index is English-tagged and mostly returns nothing for
      // Japanese-text queries; irasutoya is Japanese-tagged and wants the
      // Japanese word. Default the search box to whichever fits the source.
      searchqInput.value = activeSource === 'pixabay' ? (card.meaning || '') : stripFurigana(card.expression);
    });
  });
  el.querySelector('[data-act=change_image]').addEventListener('click', () => panel.classList.toggle('open'));
  el.querySelector('[data-act=search_img]').addEventListener('click', async () => {
    const q = el.querySelector('.searchq').value;
    const box = el.querySelector('.candidates');
    box.textContent = 'searching…';
    try {
      const res = await fetch(`/api/cards/${card.id}/candidates?query=${encodeURIComponent(q)}&source=${activeSource}`);
      const data = await res.json();
      if (data.error) { box.textContent = 'Error: ' + data.error; return; }
      box.innerHTML = '';
      for (const cand of data.results) {
        const img = document.createElement('img');
        img.src = cand.thumb_url;
        img.title = cand.title;
        img.addEventListener('click', () => selectImage(card, cand, el));
        box.appendChild(img);
      }
      if (data.results.length === 0) box.textContent = 'No results.';
    } catch (e) {
      box.textContent = 'Error: ' + e;
    }
  });

  return el;
}

async function selectImage(card, cand, el) {
  const res = await fetch(`/api/cards/${card.id}/image`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image_url: cand.image_url, source: cand.source, title: cand.title }),
  });
  const data = await res.json();
  if (data.error) { alert('Error: ' + data.error); return; }
  card.image_path = data.image_url; // relative /images/... path, good enough for display
  card.image_source = cand.source;
  loadCards();
}

async function removeImage(card) {
  const res = await fetch(`/api/cards/${card.id}/image/remove`, { method: 'POST' });
  const data = await res.json();
  if (data.error) { alert('Error: ' + data.error); return; }
  loadCards();
}

async function generateAudio(card, kind) {
  const v = selectedVoice();
  if (!v) { alert('Pick a voice first (top right).'); return; }
  const res = await fetch(`/api/cards/${card.id}/audio`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind, voice_id: v.voice_id, voice_name: v.voice_name }),
  });
  const data = await res.json();
  if (data.error) { alert('Error: ' + data.error); return; }
  card[`audio_${kind}_path`] = data.audio_url;
  card[`audio_${kind}_source`] = 'elevenlabs';
  card[`audio_${kind}_attribution`] = v.voice_name;
  refreshAudioRow(card, kind);
}

async function removeAudio(card, kind) {
  const res = await fetch(`/api/cards/${card.id}/audio/remove`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind }),
  });
  const data = await res.json();
  if (data.error) { alert('Error: ' + data.error); return; }
  card[`audio_${kind}_path`] = null;
  card[`audio_${kind}_source`] = null;
  card[`audio_${kind}_attribution`] = null;
  refreshAudioRow(card, kind);
}

async function updateCard(card, silent) {
  await fetch(`/api/cards/${card.id}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(card),
  });
  if (!silent) render(); else loadCards();
}

async function generateAllAudio() {
  const v = selectedVoice();
  if (!v) { alert('Pick a voice first (top right).'); return; }

  await loadCards(); // make sure we're working off the latest state
  const tasks = [];
  for (const card of state.cards) {
    if (!card.audio_word_path) tasks.push({ id: card.id, kind: 'word' });
    if (!card.audio_sentence_path) tasks.push({ id: card.id, kind: 'sentence' });
  }
  if (tasks.length === 0) { alert('Every card already has word + sentence audio.'); return; }

  const btn = document.getElementById('genAllBtn');
  const bar = document.getElementById('genAllBar');
  const progress = document.getElementById('genAllProgress');
  const status = document.getElementById('genAllStatus');
  btn.disabled = true;
  bar.style.display = 'flex';
  progress.max = tasks.length;
  progress.value = 0;

  const errors = [];
  for (const t of tasks) {
    status.textContent = `${progress.value}/${tasks.length}`;
    try {
      const res = await fetch(`/api/cards/${t.id}/audio`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind: t.kind, voice_id: v.voice_id, voice_name: v.voice_name }),
      });
      const data = await res.json();
      if (data.error) {
        errors.push(`#${t.id} ${t.kind}: ${data.error}`);
      } else {
        const card = state.cards.find(c => String(c.id) === String(t.id));
        if (card) {
          card[`audio_${t.kind}_path`] = data.audio_url;
          card[`audio_${t.kind}_source`] = 'elevenlabs';
          card[`audio_${t.kind}_attribution`] = v.voice_name;
          refreshAudioRow(card, t.kind);
        }
      }
    } catch (e) {
      errors.push(`#${t.id} ${t.kind}: ${e}`);
    }
    progress.value++;
  }
  status.textContent = `${progress.value}/${tasks.length}`;

  btn.disabled = false;
  bar.style.display = 'none';
  alert(errors.length
    ? `Generated ${tasks.length - errors.length}/${tasks.length}. ${errors.length} error(s):\n${errors.join('\n')}`
    : `Generated audio for ${tasks.length} clip(s).`);
}

document.getElementById('genAllBtn').addEventListener('click', generateAllAudio);
document.getElementById('hideDone').addEventListener('change', render);
document.getElementById('pushBtn').addEventListener('click', async () => {
  document.getElementById('pushBtn').textContent = 'Pushing…';
  const res = await fetch('/api/push', { method: 'POST' });
  const data = await res.json();
  document.getElementById('pushBtn').textContent = 'Push approved to Anki';
  if (data.error) { alert('Push failed: ' + data.error); return; }
  alert(`Pushed ${data.pushed.length} card(s).` + (data.errors.length ? `\n${data.errors.length} error(s): ` + JSON.stringify(data.errors) : ''));
  loadCards();
});

function escapeHtml(s) {
  return (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

loadCards();
loadVoices();
</script>
</body>
</html>
